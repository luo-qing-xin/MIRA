<!doctype html><meta charset="utf-8"><title>课程作业测试</title>
<button id="work" onclick="openWork()">作业</button><main id="main"></main>
<script>
function openWork(){document.querySelector('#main').innerHTML='<div aria-busy="true">加载中</div>';setTimeout(()=>render(1),2200)}
function render(page){document.querySelector('#main').innerHTML='<section id="list"><article><b class="title">作业 '+page+'</b><span>发布 2026-11-01</span><time class="due">2026-12-0'+page+' 23:59</time><span class="status">未提交</span></article></section><button id="next" '+(page===2?'disabled':'')+' onclick="render(2)">下一页</button>'}
</script>
